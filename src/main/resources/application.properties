spring.application.name=gestao-de-clinica-medica

# URL do seu banco local
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_medica?useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Senha@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Opcional: Mostra no console o SQL que o Spring está gerando por trás dos panos
spring.jpa.show-sql=true

# IMPORTANTE: Como você já criou o script SQL com as tabelas, deixe como "none" ou "validate".
# Se colocar "create" ou "update", o Spring vai tentar alterar as suas tabelas sozinho.
spring.jpa.hibernate.ddl-auto=none