<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clínica - Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
    <h2>Fazer Login</h2>
    <input type="text" id="log_login" placeholder="Login" required>

    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <button class="btn-secundario" onclick="window.location.href='cadastro.html'">Criar nova conta</button>

    <div id="msg_login" class="mensagem"></div>
</div>
<script src="js/main.js"></script>
</body>
</html>
