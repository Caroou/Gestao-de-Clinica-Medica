<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Clínica Médica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden border border-slate-100">

    <!-- Header -->
    <div class="bg-blue-600 p-8 text-white text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/20 mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold">Clínica Médica</h1>
      <p class="text-blue-100 text-sm mt-1">Acesse sua conta para continuar</p>
    </div>

    <!-- Form -->
    <div class="p-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Login</label>
        <input id="login" type="text" placeholder="Seu usuário"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
        <input id="senha" type="password" placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-slate-800">
      </div>

      <!-- Mensagem de erro -->
      <div id="msg" class="hidden text-sm px-4 py-2.5 rounded-lg"></div>

      <button id="btn-entrar" onclick="fazerLogin()"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 rounded-lg shadow-md shadow-blue-500/30 transition-all">
        Entrar
      </button>

      <p class="text-center text-sm text-slate-500">
        Não tem conta?
        <a href="/pages/cadastro.html" class="text-blue-600 hover:underline font-medium">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Se já logado, redireciona direto
    const _sessao = pegarSessao();
    if (_sessao && ['ADMIN', 'MEDICO', 'PACIENTE'].includes(_sessao.perfilUsuario)) {
      window.location.href = destinoDoPerfil(_sessao.perfilUsuario);
    }

    function setMsg(texto, tipo) {
      const el = document.getElementById('msg');
      el.textContent = texto;
      el.className = tipo === 'erro'
        ? 'text-sm px-4 py-2.5 rounded-lg bg-red-50 text-red-700 border border-red-200'
        : 'text-sm px-4 py-2.5 rounded-lg bg-green-50 text-green-700 border border-green-200';
    }

    async function fazerLogin() {
      const btn   = document.getElementById('btn-entrar');
      const login = document.getElementById('login').value.trim();
      const senha = document.getElementById('senha').value;

      if (!login || !senha) { setMsg('Preencha login e senha.', 'erro'); return; }

      btn.disabled = true;
      btn.textContent = 'Aguarde...';
      document.getElementById('msg').className = 'hidden';

      try {
        const usuario = await UsuarioAPI.login({ login, senha });
        if (!['ADMIN', 'MEDICO', 'PACIENTE'].includes(usuario.perfilUsuario)) {
          setMsg('Este perfil ainda não tem uma área disponível neste site.', 'erro');
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        salvarSessao(usuario);
        window.location.href = destinoDoPerfil(usuario.perfilUsuario);
      } catch (e) {
        setMsg('❌ ' + e.message, 'erro');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
  </script>
</body>
</html>
